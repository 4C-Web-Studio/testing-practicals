name: Python Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-unit.txt
      - run: python -m pytest lab06 -v --junitxml=artifacts/unit.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-results
          path: artifacts/unit.xml
